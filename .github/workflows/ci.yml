name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs on the same branch when a new push lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # v0.5.0: matches xrpl-py 5.x's supported range exactly.
        # Python 3.9 was dropped -- xrpl-py 5.x requires >= 3.10, and this
        # package now declares `requires-python = ">=3.10"`.
        # 3.13 was added: xrpl-py 5.x supports it and an institution on a
        # current Python should not be the first to find a break.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pre-commit hooks (seed scanner + any future hooks)
        # Backstop for the local pre-commit hook in case a contributor
        # commits with `--no-verify`. Runs every hook in
        # .pre-commit-config.yaml against the entire tree.
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Run pytest
        # Live XRPL testnet integration tests in
        # tests/test_integration_ledger_live.py self-skip when RUN_LIVE
        # is unset (default in CI). To run them locally:
        #   RUN_LIVE=1 python -m pytest tests/test_integration_ledger_live.py -v
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Smoke-check CLI surface
        run: |
          python -m xrpl_agent_id --version
          python -m xrpl_agent_id --api > /tmp/api_surface.json
          test -s /tmp/api_surface.json

  resolve:
    name: dependency resolution
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Report resolved dependency versions
        # v0.5.0: the point of pinning xrpl-py is that the version in use is
        # KNOWN, not whatever the resolver happens to pick. This job makes the
        # resolved xrpl-py version visible in the CI log, so a future bump
        # cannot drift silently.
        run: |
          python -m pip show xrpl-py
          python -c "import xrpl, sys; print('xrpl-py', xrpl.__version__ if hasattr(xrpl,'__version__') else '(no __version__ attr)')"

      - name: Verify the package imports cleanly
        run: python -m xrpl_agent_id --version

  reuse:
    name: REUSE license compliance
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install reuse
        run: python -m pip install --upgrade pip reuse

      - name: Verify REUSE compliance
        # The README carries an SPDX-REUSE-compliant badge. That claim is only
        # true if this passes, so it is enforced here rather than trusted.
        run: reuse lint
