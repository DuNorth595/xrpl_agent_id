name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs on the same branch when a new push lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pre-commit hooks (seed scanner + any future hooks)
        # Backstop for the local pre-commit hook in case a contributor
        # commits with `--no-verify`. Runs every hook in
        # .pre-commit-config.yaml against the entire tree.
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Run pytest
        # Live XRPL testnet integration tests in
        # tests/test_integration_ledger_live.py self-skip when RUN_LIVE
        # is unset (default in CI). To run them locally:
        #   RUN_LIVE=1 python -m pytest tests/test_integration_ledger_live.py -v
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Smoke-check CLI surface
        run: |
          python -m xrpl_agent_id --version
          python -m xrpl_agent_id --api > /tmp/api_surface.json
          test -s /tmp/api_surface.json
